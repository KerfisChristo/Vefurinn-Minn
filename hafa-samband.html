    <title>Hafa samband</title>

<body>

    <h1>Hafa samband</h1>

    <p>
        Ef þú vilt hafa samband við mig getur þú fyllt út formið hér fyrir neðan.
    </p>

    <form>

        <label for="nafn">Nafn:</label><br>
        <input type="text" id="nafn" name="nafn" required>

        <br><br>

        <label for="email">Netfang:</label><br>
        <input type="email" id="email" name="email" required>

        <br><br>

        <label for="skilabod">Skilaboð:</label><br>
        <textarea id="skilabod" name="skilabod" rows="6" cols="40"></textarea>

        <br><br>

        <button type="submit">Senda skilaboð</button>

    </form>

    <br>
